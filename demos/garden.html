<!doctype html>
<html lang="ru">

<meta charset="utf-8">

<title>Сад</title>
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/world-page.css">
</head>
<body>

<div class="loading" id="loading"></div>

<!-- Пути абсолютные: страница отдаётся по /t/<id>, относительные сломались бы. -->
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<script src="/vendor/DRACOLoader.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/vendor/qr.js"></script>
<script src="/assets/fish-frame.js"></script>
<script src="/assets/fish-glb.js"></script>
<script src="/assets/painted-uv.js"></script>
<script src="/assets/steering.js"></script>
<script src="/assets/modal.js"></script>
<script src="/assets/tank.js"></script>
<script src="/assets/world-page.js"></script>
<script>
(function () {
  'use strict';

  // ── объём полёта ─────────────────────────────────────────────────────────
  // Та же пирамида обзора, что в аквариуме: границы совпадают с кадром.
  var Z_NEAR = 5, Z_FAR = -14;
  var FLOOR = 0;
  var FLIGHT_MIN = 1.2;      // ниже не опускаются — трава
  var MARGIN = 1.4, WALL = 5;
  var CAM_POS = [0, 5.2, 15.5], CAM_TARGET = [0, 5.2, 0];
  var FOV = 42;
  var TAN_HALF_FOV = Math.tan(FOV / 2 * Math.PI / 180);

  function limitsAt(z) {
    var d = CAM_POS[2] - z;
    var half = d * TAN_HALF_FOV;
    var aspect = camera ? camera.aspect : innerWidth / innerHeight;
    var yc = CAM_TARGET[1];
    return {
      hw: half * aspect + MARGIN,
      yTop: yc + half + MARGIN,
      yBot: Math.max(FLIGHT_MIN, yc - half - MARGIN)
    };
  }

  var renderer, scene, camera, clock;
  var insects = [];
  var uTime = { value: 0 };

  // ── характеры насекомых ──────────────────────────────────────────────────
  // speed — крейсерская, flap — [частота Гц, доля размаха], jitter — сила
  // случайных рывков курса, hover — глубина «зависаний» (0 — не зависает).
  var KINDS = {
    butterflymonarch: { speed: 1.5, flap: [7, 0.16], jitter: 1.6, hover: 0 },
    butterflymorpho:  { speed: 1.4, flap: [6, 0.18], jitter: 1.6, hover: 0 },
    butterflyorange:  { speed: 1.6, flap: [8, 0.15], jitter: 1.8, hover: 0 },
    ladybug:          { speed: 0.9, flap: [0, 0],    jitter: 0.4, hover: 0 },
    bee:              { speed: 2.1, flap: [26, 0.4], jitter: 1.0, hover: 0.8 },
    dragonfly:        { speed: 2.6, flap: [22, 0.2], jitter: 2.6, hover: 0.5 }
  };
  var KIND_DEFAULT = { speed: 1.5, flap: [8, 0.15], jitter: 1.5, hover: 0 };

  // ── мах крыльев в вершинном шейдере ──────────────────────────────────────
  // Модели статичные, крылья отдельными узлами не выделены, поэтому машем
  // геометрией: чем дальше вершина от тела (|x| в локальных осях модели),
  // тем сильнее её качает вверх-вниз. Ладybug с амплитудой 0 просто плывёт.
  function addFlap(mat, span, freq, part, phase) {
    if (!freq || !part) return mat;
    var uniforms = {
      uTime: uTime,
      uFlapAmp: { value: span * part },      // размах качания кончика крыла
      uFlapFreq: { value: freq },
      uFlapPhase: { value: phase },
      uHinge: { value: span * 0.06 },        // у тела крыло не качается
      uHalfSpan: { value: Math.max(span * 0.5, 0.0001) }
    };
    var prev = mat.onBeforeCompile;
    mat.onBeforeCompile = function (shader) {
      if (prev) prev.call(this, shader);
      Object.keys(uniforms).forEach(function (k) { shader.uniforms[k] = uniforms[k]; });
      shader.vertexShader =
        'uniform float uTime; uniform float uFlapAmp; uniform float uFlapFreq;\n' +
        'uniform float uFlapPhase; uniform float uHinge; uniform float uHalfSpan;\n' +
        shader.vertexShader.replace('#include <begin_vertex>', [
          '#include <begin_vertex>',
          'float wing = clamp((abs(transformed.x) - uHinge) / uHalfSpan, 0.0, 1.0);',
          'transformed.y += wing * uFlapAmp * sin(uTime * uFlapFreq + uFlapPhase);'
        ].join('\n'));
    };
    mat.customProgramCacheKey = function () { return (prev ? 'prev+' : '') + 'flap'; };
    return mat;
  }

  // ── шаблоны видов ────────────────────────────────────────────────────────
  // Как в аквариуме: модель одна на вид, каждый экземпляр — клон с планарной
  // UV по рамке листа (top: размах по горизонтали, голова вверх).
  var templates = {}, templateQueue = {};

  function withTemplate(info, cb) {
    if (templates[info.name]) return cb(templates[info.name]);
    if (templateQueue[info.name]) return templateQueue[info.name].push(cb);
    templateQueue[info.name] = [cb];
    var spec = { url: info.model, length: info.length, frame: info.frame };
    FishGLB.load([spec], function () {
      var t = null;
      if (spec.gltf) {
        var clone = spec.gltf.scene;
        // У части моделей нормалей нет вовсе (конвертация из OBJ) — без них
        // MeshStandardMaterial рисует чёрный силуэт.
        clone.traverse(function (o) {
          if (o.isMesh && !o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        });
        var pivot = new THREE.Group();
        pivot.quaternion.copy(spec.info.quat);
        pivot.scale.setScalar(spec.info.scale);
        pivot.add(clone);
        var holder = new THREE.Group();
        holder.add(pivot);
        PaintedUV.applyPlanar(holder, info.projection || 'top');
        holder.remove(pivot);

        // размах крыльев в локальных единицах модели — для шейдера маха
        var box = new THREE.Box3().setFromObject(clone);
        t = { scene: clone, info: spec.info, span: box.max.x - box.min.x };
        templates[info.name] = t;
      }
      templateQueue[info.name].forEach(function (fn) { fn(t); });
      delete templateQueue[info.name];
    });
    return null;
  }

  // ── насекомое ────────────────────────────────────────────────────────────
  function Insect(info, tpl, tex, size) {
    var kindP = KINDS[info.name] || KIND_DEFAULT;
    this.p = kindP;
    this.len = info.length * (size || 1);
    this.phase = Math.random() * 6.28;

    var clone = tpl.scene.clone(true);
    var pivot = new THREE.Group();
    pivot.quaternion.copy(tpl.info.quat);
    pivot.scale.setScalar(tpl.info.scale * (size || 1));
    pivot.add(clone);

    var self = this;
    clone.traverse(function (o) {
      if (!o.isMesh) return;
      o.castShadow = true;    // тень на лугу привязывает бабочку к сцене
      o.material = addFlap(new THREE.MeshStandardMaterial({
        map: tex, roughness: 0.6, metalness: 0.05, side: THREE.DoubleSide
      }), tpl.span, kindP.flap[0], kindP.flap[1], self.phase);
    });

    this.mesh = new THREE.Group();
    this.mesh.add(pivot);

    var z0 = Z_FAR + Math.random() * (Z_NEAR - Z_FAR);
    var l0 = limitsAt(z0);
    this.pos = new THREE.Vector3(
      (Math.random() * 2 - 1) * Math.max(0.5, l0.hw - MARGIN),
      l0.yBot + MARGIN + Math.random() * Math.max(0.5, l0.yTop - l0.yBot - MARGIN * 2),
      z0
    );
    this.baseSpeed = kindP.speed * (0.85 + Math.random() * 0.3);
    this.speed = this.baseSpeed;
    this.vel = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5)
      .normalize().multiplyScalar(this.speed);
    this.nextJolt = 0;
    scene.add(this.mesh);
  }

  var _a = new THREE.Vector3(), _look = new THREE.Vector3();

  Insect.prototype.update = function (dt, t) {
    _a.set(0, 0, 0);
    Steering.wander(_a, t, this.phase, 1);

    // порхание: лёгкая вертикальная качка в темпе крыльев
    var flapHz = this.p.flap[0] || 6;
    _a.y += Math.sin(t * Math.min(flapHz, 9) * 0.7 + this.phase) * 0.9;

    // случайные рывки курса — бабочку носит, стрекоза дёргается
    if (t > this.nextJolt) {
      this.nextJolt = t + 0.5 + Math.random() * 0.9;
      this.vel.x += (Math.random() - 0.5) * this.p.jitter;
      this.vel.y += (Math.random() - 0.5) * this.p.jitter * 0.6;
      this.vel.z += (Math.random() - 0.5) * this.p.jitter;
    }

    // зависания: скорость проседает и возвращается волной
    if (this.p.hover) {
      var w = 0.5 + 0.5 * Math.sin(t * 0.5 + this.phase * 2.1);
      this.speed = Math.max(0.3, this.baseSpeed * (1 - this.p.hover * w));
    }

    Steering.confine(_a, this.pos, limitsAt(this.pos.z), Z_NEAR, Z_FAR, MARGIN, WALL);
    Steering.step(this, _a, dt);

    // Нос по ходу, но без крутого пикирования: бабочка почти не наклоняется.
    _look.copy(this.vel);
    _look.y *= 0.35;
    if (_look.lengthSq() < 1e-6) _look.set(0, 0, 1);
    this.mesh.position.copy(this.pos);
    this.mesh.lookAt(_look.add(this.pos));
    this.mesh.rotation.z += Math.sin(t * 1.8 + this.phase) * 0.05;
  };

  // ── окружение ────────────────────────────────────────────────────────────
  // Луг процедурный, но не «леденцовый»: холмистая земля с вершинными
  // цветами, тысячи травинок инстансами с ветром в шейдере, ромашки и маки
  // из лепестков-плоскостей, кусты и деревья спрайтами на горизонте, облака
  // и солнце. Ни одного внешнего ассета — всё рисуют канвасы.
  var clouds = [];

  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function gradientTexture(stops) {
    return canvasTex(4, 512, function (ctx) {
      var g = ctx.createLinearGradient(0, 0, 0, 512);
      stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 4, 512);
    });
  }

  // Высота луга: у камеры почти плоско (там садятся цветы и трава),
  // к горизонту — пологие волны, перетекающие в холмы.
  function groundHeight(x, z) {
    var d = Math.max(0, -z - 6) / 34;
    return Math.sin(x * 0.08 + 1.7) * Math.cos(z * 0.06) * (0.2 + 2.0 * d)
         + Math.sin(x * 0.023) * Math.cos(z * 0.031 + 0.8) * (0.4 + 2.6 * d);
  }

  function buildGround() {
    var geo = new THREE.PlaneGeometry(220, 120, 96, 52);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position;
    var colors = new Float32Array(pos.count * 3);
    // Голые цвета (без текстур) рендер считает линейными и пересветляет
    // на sRGB-выводе — переводим руками, иначе луг белёсый.
    var near = new THREE.Color(0x4e8a3d).convertSRGBToLinear();
    var far = new THREE.Color(0x74ad57).convertSRGBToLinear();
    var dry = new THREE.Color(0x9fae55).convertSRGBToLinear(), c = new THREE.Color();
    for (var i = 0; i < pos.count; i++) {
      var x = pos.getX(i), z = pos.getZ(i) - 22;   // -22 — сдвиг меша ниже
      pos.setY(i, groundHeight(x, z));
      // пятна: где-то трава светлее, где-то выгорела — сплошной цвет мёртв
      var n = 0.5 + 0.5 * Math.sin(x * 0.31 + z * 0.17) * Math.cos(x * 0.11 - z * 0.23);
      c.copy(near).lerp(far, n);
      var d2 = 0.5 + 0.5 * Math.sin(x * 0.05 + 3.1) * Math.sin(z * 0.061);
      if (d2 > 0.72) c.lerp(dry, (d2 - 0.72) * 1.8);
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    var ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
    ground.position.z = -22;
    ground.receiveShadow = true;
    scene.add(ground);
  }

  // ── трава: один InstancedMesh, ветер гнёт кончики в шейдере ──────────────
  function grassTexture() {
    return canvasTex(128, 128, function (ctx) {
      for (var i = 0; i < 9; i++) {
        var bx = 14 + i * 12 + (Math.random() - 0.5) * 8;
        var tip = bx + (Math.random() - 0.5) * 46;
        var w = 3.5 + Math.random() * 3;
        var g = ctx.createLinearGradient(0, 128, 0, 8);
        g.addColorStop(0, '#3a7230');
        g.addColorStop(1, ['#7db956', '#98cc68', '#6fae4d'][i % 3]);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(bx - w, 128);
        ctx.quadraticCurveTo(bx - w * 0.4, 50, tip, 6 + Math.random() * 20);
        ctx.quadraticCurveTo(bx + w * 0.4, 50, bx + w, 128);
        ctx.closePath();
        ctx.fill();
      }
    });
  }

  function buildGrass() {
    var COUNT = 3600;
    var geo = new THREE.PlaneGeometry(0.55, 0.85);
    geo.translate(0, 0.42, 0);
    // alphaTest повыше: в дальних мипах альфа размазывается по всему квадрату,
    // и с низким порогом трава на горизонте превращается в белые прямоугольники.
    var mat = new THREE.MeshLambertMaterial({
      map: grassTexture(), alphaTest: 0.55, side: THREE.DoubleSide
    });
    mat.onBeforeCompile = function (shader) {
      shader.uniforms.uTime = uTime;
      shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader.replace(
        '#include <begin_vertex>', [
          '#include <begin_vertex>',
          'vec4 gw = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);',
          'transformed.x += uv.y * uv.y * (sin(uTime * 1.4 + gw.x * 0.6 + gw.z * 0.8) * 0.11 + sin(uTime * 3.3 + gw.x * 1.7) * 0.05);'
        ].join('\n'));
    };
    var mesh = new THREE.InstancedMesh(geo, mat, COUNT);
    var m = new THREE.Matrix4(), q = new THREE.Quaternion();
    var p = new THREE.Vector3(), s = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
    var c = new THREE.Color(), base = new THREE.Color(0x74b558);
    for (var i = 0; i < COUNT; i++) {
      var z = 5.5 - 27 * Math.pow(Math.random(), 1.55);   // у камеры гуще, дальше луг рисует земля
      var hw = Math.min(44, (15.5 - z) * 0.72 + 4);
      var x = (Math.random() * 2 - 1) * hw;
      p.set(x, groundHeight(x, z) - 0.04, z);
      q.setFromAxisAngle(up, Math.random() * Math.PI);
      var k = 0.7 + Math.random() * 0.9;
      s.set(k, k * (0.75 + Math.random() * 0.6), k);
      mesh.setMatrixAt(i, m.compose(p, q, s));
      c.copy(base).offsetHSL((Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.2, Math.random() * 0.16 - 0.05);
      mesh.setColorAt(i, c.convertSRGBToLinear());
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
  }

  // ── цветы: ромашки и маки из лепестков-плоскостей ────────────────────────
  function petalTexture(inner, outer) {
    return canvasTex(64, 64, function (ctx) {
      var g = ctx.createLinearGradient(0, 64, 0, 0);
      g.addColorStop(0, inner);
      g.addColorStop(1, outer);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(32, 32, 14, 30, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  var FLOWER_KINDS = [
    { petals: 12, petal: ['#e8e2d4', '#ffffff'], core: 0xf2b13d, size: 0.30, cup: 0.22 }, // ромашка
    { petals: 9,  petal: ['#d88fb4', '#f4c1d2'], core: 0xf2b13d, size: 0.28, cup: 0.3 },  // космея
    { petals: 5,  petal: ['#a83430', '#d0453d'], core: 0x2c2020, size: 0.34, cup: 0.75 }, // мак
    { petals: 8,  petal: ['#8f65b8', '#b98fd8'], core: 0xe8d24a, size: 0.26, cup: 0.35 }
  ];

  function makeFlower(kind) {
    var g = new THREE.Group();
    var stemH = 0.55 + Math.random() * 0.9;
    var stemMat = new THREE.MeshLambertMaterial({ color: 0x3e7a33 });
    stemMat.color.convertSRGBToLinear();
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.045, stemH, 5), stemMat);
    stem.position.y = stemH / 2;
    stem.rotation.z = (Math.random() - 0.5) * 0.15;
    g.add(stem);

    var head = new THREE.Group();
    head.position.y = stemH;
    head.rotation.set((Math.random() - 0.3) * 0.4, Math.random() * 6.3, 0);
    var petalMat = new THREE.MeshLambertMaterial({
      map: petalTexture(kind.petal[0], kind.petal[1]),
      alphaTest: 0.5, side: THREE.DoubleSide
    });
    var petalGeo = new THREE.PlaneGeometry(kind.size * 0.55, kind.size);
    petalGeo.translate(0, kind.size / 2, 0);
    for (var i = 0; i < kind.petals; i++) {
      var petal = new THREE.Mesh(petalGeo, petalMat);
      var holder = new THREE.Group();
      holder.rotation.y = i / kind.petals * Math.PI * 2;
      petal.rotation.x = -Math.PI / 2 + kind.cup;  // лепестки чашей вверх
      holder.add(petal);
      head.add(holder);
    }
    var coreMat = new THREE.MeshLambertMaterial({ color: kind.core });
    coreMat.color.convertSRGBToLinear();
    var core = new THREE.Mesh(new THREE.SphereGeometry(kind.size * 0.32, 8, 6), coreMat);
    core.scale.y = 0.55;
    head.add(core);
    g.add(head);
    return g;
  }

  function buildFlowers() {
    // кучками, как растут на самом деле, плюс несколько одиночек
    var spots = [];
    for (var s = 0; s < 7; s++) {
      var cx = (Math.random() * 2 - 1) * 22, cz = 3 - Math.random() * 20;
      var kind = FLOWER_KINDS[Math.floor(Math.random() * FLOWER_KINDS.length)];
      var n = 3 + Math.floor(Math.random() * 5);
      for (var i = 0; i < n; i++) {
        spots.push({ x: cx + (Math.random() - 0.5) * 4, z: cz + (Math.random() - 0.5) * 3, kind: kind });
      }
    }
    for (var l = 0; l < 6; l++) {
      spots.push({
        x: (Math.random() * 2 - 1) * 26, z: 4 - Math.random() * 24,
        kind: FLOWER_KINDS[Math.floor(Math.random() * FLOWER_KINDS.length)]
      });
    }
    spots.forEach(function (sp) {
      var f = makeFlower(sp.kind);
      f.position.set(sp.x, groundHeight(sp.x, sp.z) - 0.02, sp.z);
      f.scale.setScalar(1.05 + Math.random() * 0.7);
      scene.add(f);
    });
  }

  // ── горизонт: холмы силуэтами, кусты и деревья спрайтами ─────────────────
  function hillMesh(color, amp, y0, seed, z) {
    var shape = new THREE.Shape();
    shape.moveTo(-140, -22);
    for (var x = -140; x <= 140; x += 4) {
      shape.lineTo(x, y0 + Math.sin(x * 0.045 + seed) * amp + Math.sin(x * 0.013 + seed * 2.7) * amp * 1.7);
    }
    shape.lineTo(140, -22);
    var hillMat = new THREE.MeshBasicMaterial({ color: color });
    hillMat.color.convertSRGBToLinear();
    var mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), hillMat);
    mesh.position.z = z;
    return mesh;
  }

  function foliageTexture(withTrunk) {
    return canvasTex(256, withTrunk ? 320 : 200, function (ctx, w, h) {
      if (withTrunk) {
        ctx.fillStyle = '#5d4128';
        ctx.fillRect(w / 2 - 12, h * 0.45, 24, h * 0.55);
      }
      // крона из сотни мелких пятен, тёмные снизу, светлые сверху — иначе
      // выходит «брокколи» из десятка кругов
      var crownH = withTrunk ? h * 0.6 : h;
      for (var i = 0; i < 130; i++) {
        var a = Math.random() * Math.PI * 2, r = Math.pow(Math.random(), 0.55);
        var x = w / 2 + Math.cos(a) * r * w * 0.4;
        var y = crownH * 0.52 + Math.sin(a) * r * crownH * 0.42;
        var top = 1 - y / crownH;   // 1 у макушки
        var greens = top > 0.55 ? ['#6fae4d', '#7db956'] : (top > 0.3 ? ['#4c8a3c', '#5d9c47'] : ['#376a2c', '#2f5f27']);
        ctx.fillStyle = greens[i % 2];
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(x, y, 7 + Math.random() * 12, 0, 6.3);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
  }

  function addBackdropSprites() {
    var bushTex = foliageTexture(false), treeTex = foliageTexture(true);
    for (var i = 0; i < 9; i++) {
      var tree = Math.random() < 0.45;
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tree ? treeTex : bushTex, fog: true
      }));
      sp.center.set(0.5, 0.05);
      var z = -26 - Math.random() * 14;
      // не над лугом, а по краям кадра и на горизонте
      var x = (Math.random() < 0.5 ? -1 : 1) * (16 + Math.random() * 26);
      var h = tree ? 7 + Math.random() * 4 : 3 + Math.random() * 2;
      sp.scale.set(h * 0.8, h, 1);
      sp.position.set(x, groundHeight(x, z) - 0.3, z);
      scene.add(sp);
    }
  }

  function sunSprite() {
    var tex = canvasTex(256, 256, function (ctx) {
      var g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      g.addColorStop(0, 'rgba(255, 252, 235, 1)');
      g.addColorStop(0.18, 'rgba(255, 244, 200, 0.95)');
      g.addColorStop(0.5, 'rgba(255, 236, 170, 0.25)');
      g.addColorStop(1, 'rgba(255, 236, 170, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
    });
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, fog: false, depthWrite: false
    }));
    sp.scale.set(30, 30, 1);
    sp.position.set(26, 26, -58);
    return sp;
  }

  function cloudTexture() {
    return canvasTex(512, 256, function (ctx) {
      for (var i = 0; i < 16; i++) {
        var x = 90 + Math.random() * 330, y = 90 + Math.random() * 80;
        var r = 34 + Math.random() * 46;
        var g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
        g.addColorStop(0.7, 'rgba(255, 255, 255, 0.22)');
        g.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 256);
      }
    });
  }

  function addClouds() {
    var tex = cloudTexture();
    for (var i = 0; i < 6; i++) {
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tex, fog: false, depthWrite: false,
        opacity: 0.75 + Math.random() * 0.25
      }));
      var w = 16 + Math.random() * 16;
      sp.scale.set(w, w * 0.42, 1);
      sp.position.set((Math.random() * 2 - 1) * 55, 16 + Math.random() * 12, -55 - Math.random() * 5);
      sp.userData.drift = 0.25 + Math.random() * 0.45;
      clouds.push(sp);
      scene.add(sp);
    }
  }

  function buildEnvironment() {
    scene.background = gradientTexture([
      [0, '#5f9fd8'], [0.45, '#9cc9ea'], [0.75, '#cfe6ee'], [1, '#e9f2df']
    ]);
    scene.fog = new THREE.Fog(0xd4e6da, 30, 115);

    scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x568a3f, 0.85));
    var sun = new THREE.DirectionalLight(0xfff1d6, 1.05);
    sun.position.set(14, 24, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
    sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26;
    sun.shadow.camera.near = 4; sun.shadow.camera.far = 70;
    sun.shadow.bias = -0.002;
    scene.add(sun);

    scene.add(hillMesh(0x93b483, 2.6, 6.5, 4.2, -66));
    scene.add(hillMesh(0x74a05e, 3.4, 4.0, 1.3, -62));
    scene.add(sunSprite());
    addClouds();
    buildGround();
    addBackdropSprites();
    buildGrass();
    buildFlowers();
  }

  // ── сцена ────────────────────────────────────────────────────────────────
  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(CAM_POS[0], CAM_POS[1], CAM_POS[2]);
    camera.lookAt(CAM_TARGET[0], CAM_TARGET[1], CAM_TARGET[2]);
    clock = new THREE.Clock();

    buildEnvironment();
    document.getElementById('loading').hidden = true;

    WorldPage.attachShots(renderer, scene, camera, clock);
    WorldPage.wantShot(3.5);
    addEventListener('resize', onResize);
    animate();
  }

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;
    uTime.value = t;
    FishGLB.uTime.value = t;
    for (var i = 0; i < insects.length; i++) insects[i].update(dt, t);
    for (var k = 0; k < clouds.length; k++) {
      clouds[k].position.x += clouds[k].userData.drift * dt;
      if (clouds[k].position.x > 70) clouds[k].position.x = -70;
    }
    renderer.render(scene, camera);
    WorldPage.tickShots(t);
  }

  WorldPage.boot({
    world: 'garden',
    counter: 'insects',
    hooks: {
      init: init,
      spawnPainted: function (item, info, tex, done) {
        withTemplate(info, function (tpl) {
          if (!tpl) return done(null);
          tex.encoding = THREE.sRGBEncoding;
          tex.flipY = true;
          var insect = new Insect(info, tpl, tex, item.size);
          insects.push(insect);
          done(insect);
        });
      },
      removePainted: function (insect) {
        scene.remove(insect.mesh);
        var i = insects.indexOf(insect);
        if (i !== -1) insects.splice(i, 1);
      }
    }
  });
})();
</script>
</body>
